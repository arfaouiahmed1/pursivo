name: Signed release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate SemVer tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PURSIVO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pursivo-release.jks"

      - name: Test, lint, and assemble signed APK
        env:
          PURSIVO_KEYSTORE_PATH: ${{ runner.temp }}/pursivo-release.jks
          PURSIVO_KEYSTORE_PASSWORD: ${{ secrets.PURSIVO_KEYSTORE_PASSWORD }}
          PURSIVO_KEY_ALIAS: ${{ secrets.PURSIVO_KEY_ALIAS }}
          PURSIVO_KEY_PASSWORD: ${{ secrets.PURSIVO_KEY_PASSWORD }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --stacktrace detekt test lintRelease assembleRelease \
            -Ppursivo.versionName="$VERSION" \
            -Ppursivo.versionCode="$GITHUB_RUN_NUMBER"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/pursivo-${VERSION}-universal.apk"
          cd dist
          sha256sum "pursivo-${VERSION}-universal.apk" > "pursivo-${VERSION}-universal.apk.sha256"
          SIZE=$(stat -c%s "pursivo-${VERSION}-universal.apk")
          SHA=$(cut -d' ' -f1 "pursivo-${VERSION}-universal.apk.sha256")
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          printf '{"schemaVersion":1,"version":"%s","prerelease":%s,"sizeBytes":%s,"sha256":"%s","apk":"pursivo-%s-universal.apk"}\n' \
            "$VERSION" "$PRERELEASE" "$SIZE" "$SHA" "$VERSION" > "pursivo-${VERSION}-update.json"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "apk=dist/pursivo-${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.assets.outputs.apk }}
          format: spdx-json
          output-file: dist/pursivo-${{ steps.assets.outputs.version }}-sbom.spdx.json

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--title "Pursivo ${{ steps.assets.outputs.version }}" --generate-notes)
          if [[ "${{ steps.assets.outputs.prerelease }}" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
